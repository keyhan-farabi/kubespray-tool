# Cluster Configuration File for Kubespray Deployment

# Masters configuration  
masters:
  - name: master-1
    ip: 192.168.1.100
    ssh_user: ubuntu
    ssh_key: ~/.ssh/master1_key

  - name: master-2
    ip: 192.168.1.101
    ssh_user: ubuntu  
    ssh_key: ~/.ssh/master2_key

workers:
  - name: worker-1
    ip: 192.168.1.200
    ssh_user: ubuntu
    ssh_key: ~/.ssh/worker1_key

  - name: worker-2
    ip: 192.168.1.200
    ssh_user: ubuntu
    ssh_key: ~/.ssh/worker2_key